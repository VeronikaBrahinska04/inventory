<!DOCTYPE html>
<html>

<head>
    <title>Delete Product</title>
</head>

<body>

    <h1>Delete Product</h1>

    <p>Are you sure you want to delete this product?</p>

    <h2>{{ product.name }}</h2>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">Yes Delete</button>

    </form>

    <a href="{% url 'product_list' %}">Cancel</a>

</body>

</html>
