<!DOCTYPE html>
<html>

<head>
    <title>Product List</title>
</head>

<body>

    <h1>All Products</h1>

    <a href="{% url 'product_create' %}">Add Product</a>

    <hr>

    {% for product in products %}

    <div>
        <img src="{{ product.image.url }}" width="200">

        <h2>{{ product.name }}</h2>

        <p>Price: ₹{{ product.price }}</p>

        <p>Quantity: {{ product.quantity }}</p>

        <a href="{% url 'product_detail' product.id %}">View</a>

        <a href="{% url 'product_update' product.id %}">Edit</a>

        <a href="{% url 'product_delete' product.id %}">Delete</a>
    </div>

    <hr>

    {% endfor %}

</body>

</html>
